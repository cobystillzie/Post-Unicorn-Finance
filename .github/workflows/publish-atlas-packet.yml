name: Publish Atlas Packet

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - .github/workflows/publish-atlas-packet.yml
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Verify site packet exists
        run: |
          test -f site/index.html
          test -f site/post_unicorn_industry_atlas_packet.html
          test -f site/post_unicorn_industry_atlas_entities_claims.csv
          test -f site/post_unicorn_industry_atlas_cover_note.md

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
