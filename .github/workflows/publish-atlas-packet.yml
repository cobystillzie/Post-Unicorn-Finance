name: Publish Atlas Packet

on:
  push:
    branches:
      - main
    paths:
      - site/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Verify site packet exists
        run: |
          test -f site/index.html
          test -f site/post_unicorn_industry_atlas_packet.html
          test -f site/post_unicorn_industry_atlas_packet.pdf
          test -f site/post_unicorn_industry_atlas_entities_claims.csv
          test -f site/post_unicorn_industry_atlas_cover_note.md
          test -f site/research_dossier.html
          test -f site/publish_status.json
          test -f site/publish_status.md
          test -f site/.nojekyll
          grep -q "post-unicorn-publish-id" site/index.html
          grep -q "Post-Unicorn Finance Research Dossier" site/research_dossier.html
          python - <<'PY'
          from pathlib import Path
          pdf = Path("site/post_unicorn_industry_atlas_packet.pdf")
          assert pdf.read_bytes().startswith(b"%PDF-")
          assert pdf.stat().st_size > 10_000
          PY
          python -m json.tool site/publish_status.json >/dev/null

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
